# Reference copy of `.github/workflows/verify.yml`.
name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Local Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            even-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install ECHO app dependencies
        run: npm ci --prefix even-app

      - name: Verify all local gates
        run: npm run verify:all
